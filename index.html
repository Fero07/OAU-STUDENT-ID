<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAU Student ID</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Redaction+70:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="id-container">
      <div class="identity">
        <span class="mono">OAU</span>
        <div class="name">
          <h1 class="school-name">Obafemi Awolowo University.</h1>
          <p class="location">Ile-Ife, Osun State, Nigeria</p>
        </div>
      </div>

      <div class="information">
        <div class="heading">
          <h4 class="student-id">STUDENT IDENTIFICATION</h4>
          <button>UNDERGRADUATE</button>
        </div>

        <div class="profile">
          <div class="img-container">
            <img src="images/profile.jpg" alt="Student Image" />
          </div>

          <div class="student-details">
            <div class="student-name">
              <h2>Abodunde Oluwaferanmi</h2>
              <p class="matric-no">Matric no. CSC/2023/042</p>
            </div>

            <div class="student">
              <div class="row-1">
                <p class="subtext">Department</p>
                <h6 class="text">Computer Science</h6>
              </div>

              <div class="row-2">
                <p class="subtext">Level</p>
                <h6 class="text">300</h6>
              </div>
            </div>

            <div class="student">
              <div class="row-1">
                <p class="subtext">Faculty</p>
                <h6 class="text">Science</h6>
              </div>

              <div class="row-2">
                <p class="subtext">Session</p>
                <h6 class="text">2025/26</h6>
              </div>
            </div>
          </div>
        </div>
      </div>

      <footer>
        <span class="bold">SAMPLE</span>
        <p class="footer-text">
          Classroom use only · Not an official university credential
        </p>
      </footer>
    </div>
  </body>
</html>
